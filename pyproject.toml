[project]
name = "sarah-aqua-soft-erp"
version = "1.0.0"
description = "Mobile-first document management and quotation backend"
requires-python = ">=3.13"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
    "-ra",
]
markers = [
    "integration: needs a live Postgres",
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "config/wsgi.py",
    "config/asgi.py",
    "manage.py",
]

[tool.coverage.report]
# The service layer is where the rules live; it is the part worth gating on.
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abc.abstractmethod",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "DJ",   # Django-specific
    "S",    # bandit-style security
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # DRF/Django idiom: callables in defaults
    "S101",    # assert is fine in tests
    "RUF012",  # Django class attributes are not ClassVar-annotated by convention
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]  # hard-coded test credentials are fine
"config/settings/*" = ["F403", "F405"]  # star imports are the settings idiom

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["migrations/", ".venv/"]

[tool.django-stubs]
django_settings_module = "config.settings.testing"
