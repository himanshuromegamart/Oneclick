name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/testing.txt

      - name: Ruff (lint)
        run: ruff check apps config

      - name: Ruff (format check)
        run: ruff format --check apps config

      - name: mypy
        run: mypy apps config
        continue-on-error: true  # advisory until the codebase is fully annotated

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install bandit pip-audit

      - name: Bandit (source)
        run: bandit -r apps config -ll --exclude '**/tests/**'

      - name: pip-audit (dependencies)
        run: pip-audit -r requirements/base.txt
        continue-on-error: true  # a new CVE must not block an unrelated hotfix

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_sarah_aqua_erp
          POSTGRES_USER: sarah
          POSTGRES_PASSWORD: sarah
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DJANGO_SECRET_KEY: ci-secret-key
      JWT_SIGNING_KEY: ci-jwt-key
      POSTGRES_DB: test_sarah_aqua_erp
      POSTGRES_USER: sarah
      POSTGRES_PASSWORD: sarah
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements/testing.txt

      - name: Django system checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing

      - name: Verify no missing migrations
        # Catches a model edit that was committed without its migration - the
        # failure mode that breaks the next deploy, not this one.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sarah-aqua-erp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
