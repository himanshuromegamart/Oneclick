# ---------------------------------------------------------------------------
# NGINX reverse proxy.
#
# Responsibilities: TLS termination, rate limiting at the edge, static files,
# and setting the forwarded headers Django trusts.
# ---------------------------------------------------------------------------

upstream django {
    server web:8000;
    keepalive 32;
}

# Edge rate limiting. This is the first line - the DRF throttles behind it are
# the second, and are what enforce per-user and per-phone-number policy. The
# edge limit exists to shed volumetric traffic before it costs a worker.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    server_name _;

    # In production, terminate TLS here and redirect 80 -> 443:
    #   listen 443 ssl http2;
    #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #   ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200M;   # must match MAX_UPLOAD_BYTES
    client_body_timeout 120s;
    keepalive_timeout 65s;

    # Never advertise the version - it is free reconnaissance.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    limit_conn conn_per_ip 20;

    # Probes must never be rate limited or logged - a throttled health check
    # reads as an outage.
    location ~ ^/(live|ready|health)/$ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    # Authentication endpoints get the strictest edge limit: they are the ones
    # worth brute-forcing.
    location ~ ^/api/v1/auth/(otp|token) {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        include /etc/nginx/proxy_params_custom;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        include /etc/nginx/proxy_params_custom;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_custom;
    }
}
