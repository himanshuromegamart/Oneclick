# ---------------------------------------------------------------------------
# Render blueprint.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
#
# Secrets are declared with `sync: false`, which means Render prompts for them
# on first deploy and stores them encrypted. They are deliberately NOT written
# here - this file is committed to git, and a database password in a repository
# is a password that has leaked.
#
# The database is Neon (external managed Postgres), passed in as DATABASE_URL.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: sarah-aqua-api
    # Docker, because a Dockerfile is present and Render prefers it. Declaring
    # it explicitly means the blueprint and a hand-created service behave
    # identically instead of silently diverging.
    #
    # The image itself handles the rest: collectstatic at build time, then
    # migrations and Gunicorn from docker/entrypoint.sh at start.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # closest Render region to India
    branch: main

    # /live/ answers without touching Postgres, Redis or Cloudinary. A probe
    # that checked dependencies would restart a healthy container every time
    # the database blipped - point uptime monitoring at /ready/ instead.
    healthCheckPath: /live/

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      # One worker with several threads fits the 512 MB free instance. The work
      # is almost entirely waiting on Postgres and Cloudinary, so threads cost
      # far less memory than processes and serve the same concurrency.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"

      # Render generates these once and keeps them. Rotating either logs
      # everyone out, which is the intended behaviour if one leaks.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true

      # --- Secrets: enter these in the Render dashboard ------------------
      # Neon connection string, e.g.
      #   postgresql://USER:PASSWORD@HOST.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: SMS_USER_ID
        sync: false
      - key: SMS_PASSWORD
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_ENTITY_ID
        sync: false
      - key: SMS_TEMPLATE_ID
        sync: false

      # --- Non-secret configuration --------------------------------------
      # Real SMS. Switch to ConsoleSMSBackend to test without spending credits.
      - key: SMS_BACKEND
        value: apps.accounts.sms.NimbusITSMSBackend
      - key: SMS_BASE_URL
        value: https://nimbusit.biz/api/SmsApi/SendSingleApi

      - key: CLOUDINARY_UPLOAD_FOLDER
        value: sarah-aqua-soft
      - key: CLOUDINARY_SIGNED_URL_TTL
        value: "900"

      # A native mobile app sends no Origin header, so CORS does not apply to
      # it. Left open because the API is token-authenticated and cookie-free;
      # set CORS_ALLOWED_ORIGINS instead if a web client is added.
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"

      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMATTER
        value: json
      - key: SECURE_SSL_REDIRECT
        value: "true"

      - key: OTP_TTL_SECONDS
        value: "300"
      - key: OTP_MAX_SENDS_PER_DAY
        value: "10"
      # 10 MB - what Cloudinary's free plan accepts. Raising this without
      # raising the Cloudinary plan just moves the failure later.
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: RECYCLE_BIN_RETENTION_DAYS
        value: "30"
      - key: SHARE_LINK_TTL_HOURS
        value: "168"

      # Optional. Leave unset and the app falls back to an in-process cache -
      # fine for a single instance. Add a Redis URL before scaling to several.
      # - key: REDIS_URL
      #   sync: false
